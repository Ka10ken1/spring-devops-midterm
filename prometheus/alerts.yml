groups:
  - name: spring-app-alerts
    rules:
      - alert: HighApplicationErrorRate
        expr: increase(app_errors_total[1m]) > 5
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: Application error rate exceeded threshold"
          description: "More than 5 errors occurred in the last minute (current value: {{ $value }})."
