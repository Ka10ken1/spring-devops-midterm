apiVersion: 1

# Email contact point — requires SMTP to be configured in Grafana.
# Uncomment the SMTP env vars in docker-compose.yml and set valid credentials.
contactPoints:
  - orgId: 1
    name: default-email
    receivers:
      - uid: default-receiver
        type: email
        settings:
          addresses: admin@example.com
        disableResolveMessage: false
