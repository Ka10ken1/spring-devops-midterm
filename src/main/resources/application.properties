spring.application.name=midterm

app.settings.title=Midterm Application
app.settings.pagination-limit=20
app.settings.contact-email=support@midterm.app

server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=always

spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger-ui.html

# Spring Boot Actuator (base path: /manage to avoid conflict with custom /actuator/*)
management.endpoints.web.base-path=/manage
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=midterm

management.info.app.name=${spring.application.name}
management.info.app.version=1.0.0
management.info.app.description=Midterm Spring Boot Application
management.info.contact.email=${app.settings.contact-email}

# Logging levels (overridable per profile)
logging.level.com.spring_midterm.midterm=INFO
logging.level.org.springframework.security=INFO
