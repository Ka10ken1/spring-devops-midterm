<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Students | Midterm/Finals Hub</title>
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
	<header class="topbar">
		<a class="brand" th:href="@{/profile}">Midterm/Finals Hub</a>
		<nav class="nav-links">
			<a th:href="@{/profile}">Dashboard</a>
			<a th:if="${isAdmin}" th:href="@{/admin}">Admin</a>
			<form th:action="@{/logout}" method="post">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
				<button class="link-button" type="submit">Logout</button>
			</form>
		</nav>
	</header>

	<main class="container">
		<section class="panel">
			<div class="section-heading compact">
				<div>
					<p class="eyebrow">Students</p>
					<h1>Directory</h1>
					<p class="muted">Regular users can choose an existing student and assign tasks from the detail page.</p>
				</div>
			</div>
			<form class="search" th:action="@{/students}" method="get">
				<input name="search" type="search" placeholder="Search by name or email" th:value="${search}">
				<button class="button secondary" type="submit">Search</button>
			</form>
			<div class="cards-list" th:if="${!students.isEmpty()}">
				<a class="row-card" th:each="student : ${students}" th:href="@{/students/{id}(id=${student.id})}">
					<div>
						<strong th:text="${student.firstName + ' ' + student.lastName}">Student Name</strong>
						<span th:text="${student.email}">student@example.com</span>
					</div>
					<span class="pill">Tasks</span>
				</a>
			</div>
			<p class="empty-state" th:if="${students.isEmpty()}">No students match your search.</p>
		</section>
	</main>
</body>
</html>
