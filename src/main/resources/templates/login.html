<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Login | Midterm Hub</title>
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
	<main class="auth-card">
		<a class="brand center" th:href="@{/}">Midterm Hub</a>
		<h1>Welcome back</h1>
		<p class="muted">Sign in to access protected student, task, and note pages.</p>

		<div class="alert error" th:if="${param.error}">Invalid username or password.</div>
		<div class="alert success" th:if="${param.logout}">You have been logged out.</div>

		<form class="stack" th:action="@{/login}" method="post">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<label>
				Username
				<input name="username" type="text" autocomplete="username" required autofocus>
			</label>
			<label>
				Password
				<input name="password" type="password" autocomplete="current-password" required>
			</label>
			<button class="button primary full" type="submit">Login</button>
		</form>

		<div class="credentials">
			<p><strong>User:</strong> user / user123</p>
			<p><strong>Admin:</strong> admin / admin123</p>
		</div>
	</main>
</body>
</html>
