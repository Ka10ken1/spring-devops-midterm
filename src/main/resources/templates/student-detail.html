<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${student.firstName + ' ' + student.lastName}">Student</title>
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
	<header class="topbar">
		<a class="brand" th:href="@{/profile}">Midterm Hub</a>
		<nav class="nav-links">
			<a th:href="@{/students}">Students</a>
			<a th:if="${isAdmin}" th:href="@{/admin}">Admin</a>
			<form th:action="@{/logout}" method="post">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
				<button class="link-button" type="submit">Logout</button>
			</form>
		</nav>
	</header>

	<main class="container two-column">
		<section class="panel">
			<p class="eyebrow">Student</p>
			<h1 th:text="${student.firstName + ' ' + student.lastName}">Student Name</h1>
			<p class="muted" th:text="${student.email}">student@example.com</p>

			<hr>
			<p class="eyebrow">Create Task</p>
			<form class="stack" th:action="@{/students/{id}/tasks(id=${student.id})}" method="post">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
				<label>
					Title
					<input name="title" type="text" minlength="2" maxlength="100" required>
				</label>
				<label>
					Description
					<textarea name="description" rows="4" maxlength="1000"></textarea>
				</label>
				<label>
					Due date
					<input name="dueDate" type="date">
				</label>
				<label class="checkbox">
					<input name="completed" type="checkbox" value="true">
					Mark as completed
				</label>
				<button class="button primary full" type="submit">Create task</button>
			</form>
		</section>

		<section class="panel">
			<p class="eyebrow">Tasks</p>
			<h1>Assigned work</h1>
			<div class="cards-list" th:if="${!tasks.isEmpty()}">
				<a class="row-card" th:each="task : ${tasks}" th:href="@{/students/{studentId}/tasks/{taskId}(studentId=${student.id},taskId=${task.id})}">
					<div>
						<strong th:text="${task.title}">Task title</strong>
						<span th:text="${task.dueDate == null ? 'No due date' : 'Due ' + task.dueDate}">Due date</span>
					</div>
					<span class="pill" th:text="${task.completed ? 'Done' : 'Open'}">Open</span>
				</a>
			</div>
			<p class="empty-state" th:if="${tasks.isEmpty()}">This student does not have tasks yet.</p>
		</section>
	</main>
</body>
</html>
