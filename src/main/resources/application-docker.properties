# Docker profile - runs with PostgreSQL via Docker Compose
spring.datasource.url=jdbc:postgresql://postgres:5432/spring_boot_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.settings.pagination-limit=50

# Logging - JSON to stdout for Loki
logging.level.com.spring_midterm.midterm=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

spring.devtools.restart.enabled=false
